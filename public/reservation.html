<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserve a Table — Gyenos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo">Gyenos</a>
    <ul class="navlinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#menu">Menu</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="reservation.html">Reservation</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <a href="reservation.html" class="btn">Reserve</a>
  </nav>
</header>

<section class="block reveal" style="padding-top:160px;">
  <div class="wrap">
    <div class="reserve-layout">
      <div class="reserve-photo">
        <img src="https://images.unsplash.com/photo-1634114236822-9d0a72cc94a2?fm=jpg&q=75&w=1000&auto=format&fit=crop" alt="A candlelit dinner table">
      </div>
      <div>
        <div class="section-head" style="margin-bottom:40px;text-align:left;margin-left:0;">
          <span class="eyebrow">Reserve a Table</span>
          <h2>Come to the Table</h2>
          <p>Tell us when you'd like to join us, and we'll take care of the rest.</p>
        </div>

        <form id="reservation-form">
          <div class="field-row">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" placeholder="Your name" required>
            </div>
            <div class="field">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" placeholder="+995 ..." required>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="date">Date</label>
              <input id="date" name="date" type="date" required>
            </div>
            <div class="field">
              <label for="party">Party Size</label>
              <select id="party" name="party">
                <option>1–2 guests</option>
                <option>3–4 guests</option>
                <option>5–8 guests</option>
                <option>9+ guests</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" placeholder="Anything we should know — allergies, occasion, seating preference"></textarea>
          </div>
          <button type="submit" class="btn">Request a Table</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>
</section>

<footer>
  <a href="index.html" class="logo">Gyenos</a>
  <div class="footer-links">
    <a href="index.html#menu">Menu</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </div>
  <p class="copy">© 2026 Gyenos Georgian Table &amp; Wine House</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
